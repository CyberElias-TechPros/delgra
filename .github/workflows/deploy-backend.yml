name: Deploy backend

# Deploys delgra backend on push to main. Migrations history matches
# production (0001_init applied), so `migrations apply` is safe.
# The deploy step tolerates cron-trigger errors (free-plan caps); the
# health gate below is the real pass/fail.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CF_API_TOKEN / CF_ACCOUNT_ID repo secrets (Admin account)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-fund --no-audit
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply delgra-db --remote
        working-directory: backend
      - name: Deploy to Cloudflare Workers
        id: deploy
        continue-on-error: true
        run: npx wrangler deploy
        working-directory: backend
      - name: Verify health
        run: |
          body="$(curl -fsS https://delgra.autumn-surf-21ec.workers.dev/v1/health)"
          echo "$body"
          echo "$body" | grep -q '"status":"ok"' || { echo "::error::delgra health check failed"; exit 1; }
          if [ "${{ steps.deploy.outcome }}" = "failure" ]; then
            echo "::warning::Code is live and healthy, but wrangler reported trigger errors (likely free-plan cron cap). Check the deploy log."
          fi
